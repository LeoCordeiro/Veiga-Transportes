<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Veiga Transportes — entregas sob demanda na Grande São Paulo</title>
    <meta
      name="description"
      content="Rede de entregadores sob demanda em toda a Grande São Paulo. Entrega avulsa ou rota fixa, com moto, bike ou carro. Atendimento na hora e confirmação por foto e assinatura."
    />
    <meta name="theme-color" content="#1A1A1A" />

    <!-- O SVG é o principal: escala sem serrilhar em qualquer densidade de
         tela. Os PNG cobrem quem não lê SVG, o .ico atende o navegador que
         pede /favicon.ico na raiz por conta própria, e o iOS ignora todos e
         usa o apple-touch-icon. Gerados por scripts/gerar-icones.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#FFC107" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Veiga Transportes — entregas sob demanda na Grande São Paulo" />
    <meta
      property="og:description"
      content="Entrega avulsa ou rota fixa em toda a Grande São Paulo. Você chama e alguém responde na hora. Sem manter frota própria."
    />
    <meta property="og:image" content="/og-veiga.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- As três famílias, carregadas UMA vez e só nos pesos usados.
         Archivo: 900 e 900 itálico (display) + 700 (rótulo da marca).
         IBM Plex Sans: 400 (corpo) e 700 (rótulo, botão).
         IBM Plex Mono: 500 e 700 (dado com função real).
         Qualquer quarta família na página é fonte vazando. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,900;1,900&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <!-- Filtro duotone grafite → âmbar, global.
         Fica no index e não num componente porque é referenciado por url(#id)
         de qualquer lugar do site: dentro de um componente com v-if ele some
         do DOM e toda foto da página perde o tratamento de uma vez.

         A curva tem 4 pontos, não 2: com dois, o mapeamento é linear, joga
         todo meio-tom para o âmbar e a foto vira mostarda chapada. Testado
         lado a lado antes de fechar. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="duotone-veiga" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.33 0.33 0.33 0 0
                  0.33 0.33 0.33 0 0
                  0.33 0.33 0.33 0 0
                  0    0    0    1 0"
        />
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.06 0.20 0.50 1.0" />
          <feFuncG type="table" tableValues="0.06 0.16 0.36 0.757" />
          <feFuncB type="table" tableValues="0.07 0.10 0.12 0.10" />
        </feComponentTransfer>
      </filter>
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
